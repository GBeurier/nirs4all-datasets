name: CI

on:
  push:
    branches: [main, 'rc/**', 'integration/release-20261109']
  pull_request:

jobs:
  rust:
    name: Rust green gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Checkout sibling Rust deps
        run: scripts/ensure_rust_deps.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Put cargo bin on PATH
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Build core (no default features)
        run: cargo build -p nirs4all-datasets-core --no-default-features

  wasm:
    name: WASM/JS green gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Checkout sibling Rust deps
        run: scripts/ensure_rust_deps.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install wasm-pack
        # install copies across filesystems; the upstream action's rename fails with EXDEV
        # when /tmp and ~/.cargo are mounted on different devices.
        run: |
          set -euo pipefail
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT
          curl -fsSL --retry 3 https://github.com/rustwasm/wasm-pack/releases/download/v0.15.0/wasm-pack-v0.15.0-x86_64-unknown-linux-musl.tar.gz -o "$tmp_dir/wasm-pack.tar.gz"
          tar -xzf "$tmp_dir/wasm-pack.tar.gz" -C "$tmp_dir"
          install -m 755 "$tmp_dir/wasm-pack-v0.15.0-x86_64-unknown-linux-musl/wasm-pack" "$HOME/.cargo/bin/wasm-pack"
          wasm-pack --version

      - name: Build Node WASM package
        run: wasm-pack build bindings/wasm --release --target nodejs --out-dir pkg-node --scope nirs4all
      - name: Pin package name used for npm
        working-directory: bindings/wasm/pkg-node
        run: |
          node -e '
            const fs = require("fs");
            const p = JSON.parse(fs.readFileSync("package.json", "utf8"));
            p.name = "@nirs4all/datasets-wasm";
            fs.writeFileSync("package.json", JSON.stringify(p, null, 2) + "\n");
          '
          node -e 'const p = require("./package.json"); if (p.name !== "@nirs4all/datasets-wasm") throw new Error(p.name)'
      - name: Smoke-test Node WASM package
        run: node bindings/wasm/tests/node_smoke.cjs
      - name: npm pack dry-run
        working-directory: bindings/wasm/pkg-node
        run: npm pack --dry-run
      - name: Build browser WASM package
        run: wasm-pack build bindings/wasm --release --target web --out-dir pkg-web --scope nirs4all

  python:
    name: Python green gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Checkout sibling Rust deps
        run: scripts/ensure_rust_deps.sh
      - uses: dtolnay/rust-toolchain@stable
      - name: Put cargo bin on PATH
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.11"
      - name: Install maturin
        run: uv tool install maturin
      - name: Install (editable, with the native acquisition extension)
        # The root pyproject is a maturin project: `uv pip install -e .[dev]`
        # builds the embedded `nirs4all_datasets._n4ds` Rust extension and the
        # pure-Python analysis layer together. The nirs4all card-metric bridge is
        # a separate optional extra (unpublished editable nirs4all), skipped here.
        run: |
          uv venv --clear
          uv pip install -e ".[dev]"
      - name: Ruff
        run: uv run --no-sync ruff check .
      - name: Mypy
        run: uv run --no-sync mypy --config-file pyproject.toml src
      - name: Validate catalog descriptors
        run: uv run --no-sync python catalog/scripts/validate.py
      - name: Catalog index is up to date
        run: |
          uv run --no-sync python -m nirs4all_datasets.cli catalog --root .
          git diff --exit-code catalog/datasets.yaml
      - name: Pytest (no network)
        run: uv run --no-sync python -m pytest -m "not network"
      - name: R build recipes (native, Windows ARM64, WebR)
        run: uv run --no-sync python -m pytest -q bindings/r/tests

  # The Windows build links the Rust static library with the Rtools linker, so it
  # depends on the current stable Rust and Rtools, not only on this tree. Run the
  # same vendored, offline R CMD check as the Windows leg of release-r.yml on every
  # pull request so a break is seen before a release tag.
  r-windows:
    name: R CMD check (Windows)
    runs-on: windows-2022
    env:
      R_KEEP_PKG_SOURCE: yes
      # The build is offline; disable the incoming-feasibility URL check.
      _R_CHECK_CRAN_INCOMING_REMOTE_: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Checkout sibling Rust deps
        shell: bash
        run: scripts/ensure_rust_deps.sh
      - uses: dtolnay/rust-toolchain@stable
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          r-version: "release"
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          working-directory: bindings/r/nirs4alldatasets
          extra-packages: |
            any::rcmdcheck
      # N4DS_R_VENDOR=1 is scoped to this step, where crates/ is reachable; the
      # check then installs offline from the bundled copy (see release-r.yml).
      - name: Vendor the Rust core into the R package
        shell: bash
        run: cd bindings/r/nirs4alldatasets && N4DS_R_VENDOR=1 ./configure
      - name: R CMD check --as-cran
        uses: r-lib/actions/check-r-package@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        env:
          CARGO_NET_OFFLINE: "true"
        with:
          working-directory: bindings/r/nirs4alldatasets
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"warning"'
      # The job log only says "Installation failed"; the compiler/linker output
      # is in 00install.out.
      - name: Show the install log on failure
        if: failure()
        shell: bash
        run: tail -n 80 bindings/r/nirs4alldatasets/check/*.Rcheck/00install.out
