version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python:
        patterns: ["*"]
    commit-message:
      prefix: "chore"

  - package-ecosystem: "pip"
    directory: "/docs"
    schedule:
      interval: "weekly"
    groups:
      docs:
        patterns: ["*"]
    commit-message:
      prefix: "docs"

  # Cargo resolution uses sibling path dependencies to nirs4all-formats and
  # nirs4all-io. Dependabot checks out only this repository, so its updater
  # cannot resolve those paths and produces a permanently failing job. Rust
  # dependency upgrades are coordinated manually with the sibling releases.
