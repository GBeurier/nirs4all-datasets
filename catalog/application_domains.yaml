# SPDX-License-Identifier: CECILL-2.1 OR AGPL-3.0-or-later
# Curated scientific application domains, one entry per catalog dataset id.
#
# Human-curated catalog metadata (provisional, first curation 2026-11-22): each primary domain is
# assigned from the reviewed dataset display name (catalog/documentation/dataset-display-names-20261105.csv)
# and, where noted, the declared target variables. It is not an origin-declared field and is not part of
# the dataset descriptor, card or processing/metadata hashes. `primary` drives the site's "Datasets by
# domain" chart; `secondary` records other relevant domains. Every catalog dataset must have an entry
# (enforced by tests/test_application_domains.py); new datasets must be curated here.
