# Current main integration train; immutable v0.3.10 keeps its original train.
# Manifests depend on the sibling owners at minor granularity ("0.3", ">=0.3,<0.4");
# this file is the exact source train: CI and the R vendoring check out these
# tags, and the lockfiles must resolve exactly these versions.
schema_version = 1
release_version = "0.4.0"

[dependencies]
nirs4all-formats = "0.3.1"
nirs4all-io = "0.4.0" # Exact public version required by the registry gate.

[prerequisites]
# No additional runtime crate is required by the selected IO facade/core.

[registries]
crates_io = ["nirs4all-formats", "nirs4all-io"]
